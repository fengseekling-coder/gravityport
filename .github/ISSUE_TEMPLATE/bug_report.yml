name: Bug report
description: Report a reproducible GravityPort defect without private user data
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include real Prompts, user assets, Tokens, credentials, session identifiers, or private local paths. Report security vulnerabilities through SECURITY.md instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing Issues and Discussions.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I replaced private data and local paths with safe placeholders.
          required: true
  - type: input
    id: version
    attributes:
      label: GravityPort version or commit
      description: The desktop app shows its version in Settings → About. For a source checkout, use the commit SHA.
      placeholder: 0.3.5 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - Windows 10/11 x64
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run GravityPort?
      options:
        - Desktop app downloaded from the official site
        - Desktop app built from source
        - Source checkout (npm start / web UI)
        - MCP server or CLI
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gallery, Inspector, or Settings UI
        - Desktop install, startup, or updates
        - Codex collection
        - ChatGPT web capture
        - Gemini, Flow, or Google AI Studio web capture
        - Grok collection
        - Cowart collection
        - Local visual search (Visual Pack)
        - MCP server or CLI
        - Library storage, migration, backup, or search
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use sample data and placeholder paths.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Relevant sanitized output
      description: Include only the smallest useful error or status output. In the desktop app, Settings → Feedback → "Include diagnostic log" lets you view the redacted log first.
      render: shell
