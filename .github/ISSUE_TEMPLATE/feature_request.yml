name: Feature request
description: Propose a focused GravityPort improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before the implementation. Do not include private Prompts, user assets, credentials, Tokens, or local paths.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing Issues and Discussions.
          required: true
        - label: This request stays within GravityPort's local-first creative-memory scope.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable user result, not only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and data impact
      description: What local files, browser data, network access, or permissions would this require?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
