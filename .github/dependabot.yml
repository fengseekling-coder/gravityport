# Version updates cover GitHub Actions only. npm dependencies get
# security updates (enabled in the repository settings), not routine bumps,
# because packaging-related upgrades can break the desktop build.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
