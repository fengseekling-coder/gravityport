name: CI

# Fast checks on every pull request and main push (~3 min).
# Packaging, installer, and e2e runs live in desktop.yml.

on:
  pull_request:
  push:
    branches: [main]

# The verify job only reads the checkout: no job here publishes, deploys, or
# touches anything, so the workflow token stays read-only (352 建5).
permissions:
  contents: read

# A new push to the same pull request supersedes its previous run. Main
# pushes share the group but are not cancelled: cancel-in-progress only
# turns on for pull_request events (352 建5).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Green runs land at ~3.5 min (run 41492235009: 3m34s); 15 leaves >4x
    # headroom and still bounds a hung install or test run (352 建5).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run test:performance
      - run: npm run audit
