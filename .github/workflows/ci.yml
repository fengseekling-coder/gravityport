name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run test:performance
      - run: npm run audit

  desktop-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node -e "require('electron')"
      - run: node -e "if (process.arch !== 'arm64') throw new Error('Expected arm64 macOS runner')"
      - run: node --test test/desktop-packaging.test.mjs test/electron-preload-runtime-contract.test.mjs
        env:
          MOSA_ELECTRON_PRELOAD_SMOKE: "1"
      - run: npm run test:e2e
      - run: npm run desktop:package
      - run: codesign --verify --deep --strict --verbose=2 out/GravityPort-darwin-arm64/GravityPort.app
      - run: npm run qa:packaged:smoke

  desktop-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node -e "require('electron')"
      - run: node -e "if (process.arch !== 'x64') throw new Error('Expected x64 Windows runner')"
      - run: node --test test/desktop-packaging.test.mjs test/desktop-platform-adapter.test.mjs test/desktop-runtime-paths.test.mjs test/electron-preload-runtime-contract.test.mjs test/path-safety.test.mjs test/source-locations.test.mjs test/windows-updater.test.mjs test/windows-updater-install-rehearsal.test.mjs
        env:
          MOSA_ELECTRON_PRELOAD_SMOKE: "1"
      - run: npm run test:e2e
      - run: npm run desktop:package:windows
      - run: npm run qa:packaged:smoke
