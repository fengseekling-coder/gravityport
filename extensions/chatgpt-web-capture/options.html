<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>GravityPort 浏览器扩展设置</title>
    <style>
      body {
        --mosa-error: #b91c1c;
        --mosa-success: #166534;
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
        margin: 24px;
        max-width: 560px;
        color: #0f172a;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      input[type="text"],
      input[type="url"],
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #2424ff;
        outline-offset: 2px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
      }
      button {
        margin-top: 18px;
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        background: #111827;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: filter 120ms ease;
      }
      #status {
        margin-top: 12px;
        color: #166534;
        min-height: 1.2em;
      }
      code {
        background: #f1f5f9;
        padding: 1px 5px;
        border-radius: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        button { transition: none; }
      }
    </style>
  </head>
  <body>
    <h1>GravityPort 浏览器扩展</h1>
    <p>将 AI 生成的图片和视频连同提示词收录到本机 GravityPort。图片支持 ChatGPT、Gemini、Flow、Google AI Studio、即梦；视频支持 Flow、Google AI Studio、即梦。</p>
    <section style="padding:12px;border-radius:12px;background:#f8fafc;margin-bottom:16px">
      <strong>收录方式</strong>
      <p style="margin:6px 0;color:#475569">自动收录新生成的图片和视频，也可通过右键菜单手动保存。</p>
    </section>
    <p>扩展会自动连接本机的 GravityPort。以下地址和令牌（Token）仅用于诊断或高级设置。</p>

    <label for="mosaBaseUrl">GravityPort 地址</label>
    <input id="mosaBaseUrl" type="url" placeholder="http://127.0.0.1:43517" />

    <label for="mosaToken">访问令牌（Token）</label>
    <input id="mosaToken" type="password" autocomplete="off" placeholder="自动连接，无需填写" />

    <div class="row">
      <input id="autoCapture" type="checkbox" />
      <label for="autoCapture" style="margin: 0; font-weight: 500">自动收录</label>
    </div>
    <p style="margin:8px 0 0;color:#475569;font-size:12px">
      开启后，扩展仅在支持的网站上读取与生成内容相关的页面数据，并将图片、视频、提示词和来源发送到本机的 GravityPort。默认关闭，不会上传到云端。
    </p>

    <button id="save" type="button">保存</button>
    <button id="test" type="button" style="background: #334155; margin-left: 8px">测试连接</button>
    <button id="repair" type="button" style="background: #334155; margin-left: 8px">重新配对</button>
    <div id="status" role="status" aria-live="polite"></div>

    <script src="options.js" type="module"></script>
  </body>
</html>
