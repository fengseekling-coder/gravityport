<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GravityPort</title>
    <!-- Blocking, same-origin theme bootstrap: runs before the stylesheet so a
         saved dark-mode preference is applied before first paint (no FOUC).
         Kept as an external file to satisfy the runtime CSP (script-src 'self'). -->
    <script src="/theme-init.mjs"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="mosa-v2">
    <!-- Phase 5C / F-16：双通道反馈——polite lane（success/default，容器 role=status）与
         assertive lane（容器无 live region，每条 Error Toast 自身 role=alert）。两容器物理独立、
         初始为空、不占布局、不拦截下方点击（pointer-events 仅 Toast 自身）。 -->
    <div class="toast-stack toast-stack-polite" id="toastContainer" role="status" aria-live="polite" aria-relevant="additions text" aria-atomic="false"></div>
    <div class="toast-stack toast-stack-assertive" id="toastErrorContainer" data-i18n-aria-label="notifications" aria-label="通知"></div>

    <div class="drag-overlay" id="dragOverlay" role="region" data-i18n-aria-label="dropToImport" aria-label="拖放文件或文件夹到此处导入" aria-labelledby="dragOverlayLabel" hidden>
      <div class="drag-overlay-content">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
        <p id="dragOverlayLabel" data-i18n="dropToImport">拖放文件或文件夹到此处导入</p>
      </div>
    </div>

    <div class="modal-overlay" id="groupModal" aria-hidden="true">
      <div class="modal-card group-modal-card" role="dialog" aria-modal="true" aria-labelledby="groupModalTitle" tabindex="-1">
        <div class="modal-header">
          <h3 id="groupModalTitle" data-i18n="createGroup">添加分组</h3>
          <button class="icon-button" id="closeGroupModal" type="button" data-i18n-aria-label="closeGroup" aria-label="关闭添加分组窗口">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <label class="field"><span data-i18n="groupName">分组名称</span><input id="groupNameInput" data-i18n-placeholder="groupNamePlaceholder" placeholder="例如：灵感参考" maxlength="80" /></label>
          <div class="group-color-field">
            <span data-i18n="groupColor">颜色</span>
            <div class="group-color-options" role="group" data-i18n-aria-label="groupColor" aria-label="颜色">
              <button class="group-color-swatch selected" type="button" data-group-color="#6366f1" aria-pressed="true" data-i18n-aria-label="groupColorIndigo" aria-label="选择靛蓝"></button>
              <button class="group-color-swatch" type="button" data-group-color="#f59e0b" aria-pressed="false" data-i18n-aria-label="groupColorAmber" aria-label="选择琥珀"></button>
              <button class="group-color-swatch" type="button" data-group-color="#10b981" aria-pressed="false" data-i18n-aria-label="groupColorEmerald" aria-label="选择翠绿"></button>
              <button class="group-color-swatch" type="button" data-group-color="#ef4444" aria-pressed="false" data-i18n-aria-label="groupColorRed" aria-label="选择红色"></button>
              <button class="group-color-swatch" type="button" data-group-color="#8b5cf6" aria-pressed="false" data-i18n-aria-label="groupColorViolet" aria-label="选择紫罗兰"></button>
              <button class="group-color-swatch" type="button" data-group-color="#ec4899" aria-pressed="false" data-i18n-aria-label="groupColorPink" aria-label="选择粉色"></button>
            </div>
          </div>
        </div>
        <div class="modal-footer"><button class="btn-secondary" id="cancelGroupBtn" type="button" data-i18n="cancel">取消</button><button class="btn-primary" id="saveGroupBtn" type="button" data-i18n="createGroup">添加分组</button></div>
      </div>
    </div>

    <!-- Stack 重命名：右键堆叠 → 重命名。单一名称输入收集器，提交回调由调用方注入。 -->
    <div class="modal-overlay" id="stackRenameModal" aria-hidden="true">
      <div class="modal-card group-modal-card" role="dialog" aria-modal="true" aria-labelledby="stackRenameModalTitle" tabindex="-1">
        <div class="modal-header">
          <h3 id="stackRenameModalTitle" data-i18n="renameStackTitle">重命名堆叠</h3>
          <button class="icon-button" id="stackRenameModalClose" type="button" data-i18n-aria-label="closeStackRename" aria-label="关闭重命名堆叠窗口">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <label class="field"><span data-i18n="stackName">堆叠名称</span><input id="stackRenameInput" data-i18n-placeholder="stackNamePlaceholder" placeholder="例如：灵感参考" maxlength="80" /></label>
        </div>
        <div class="modal-footer"><button class="btn-secondary" id="cancelStackRenameBtn" type="button" data-i18n="cancel">取消</button><button class="btn-primary" id="saveStackRenameBtn" type="button" data-i18n="renameStack">重命名</button></div>
      </div>
    </div>

    <!-- 分组统计：右键分组 → 分组统计。内容按 /api/groups/:name/stats 渲染。 -->
    <div class="modal-overlay" id="groupStatsModal" aria-hidden="true">
      <div class="modal-card group-stats-card" role="dialog" aria-modal="true" aria-labelledby="groupStatsTitle" tabindex="-1">
        <div class="modal-header">
          <h3 id="groupStatsTitle">分组统计</h3>
          <button class="icon-button" id="closeGroupStatsModal" type="button" data-i18n-aria-label="closeGroupStats" aria-label="关闭分组统计">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="modal-body group-stats-body" id="groupStatsBody"></div>
        <div class="modal-footer"><button class="btn-primary" id="groupStatsCloseBtn" type="button" data-i18n="close">关闭</button></div>
      </div>
    </div>

    <!-- Phase 5B / F-15：全应用唯一 ConfirmDialog——替换 window.confirm 的四条业务确认
         （批量归档、单素材归档、放弃未保存修改、受限参考图再生）。标题/说明/确认按钮文案
         由 requestConfirmation 动态填充；Cancel 固定复用 cancel。tone 切换确认按钮原语：
         danger→btn-danger（DestructiveButton 红色 outline），warning→btn-primary（品牌蓝）。
         任务 94（A4f）：底行左侧是「不再提醒」勾选框（仅 requestConfirmation 传入
         dontAskAgainKey 的调用显示，每次打开默认未勾选），右侧否/取消 + 是/确认按钮。 -->
    <div class="modal-overlay confirm-dialog-overlay" id="confirmDialog" aria-hidden="true">
      <div class="modal-card confirm-dialog-card" id="confirmDialogCard" role="dialog" aria-modal="true" aria-labelledby="confirmDialogTitle" aria-describedby="confirmDialogDescription" tabindex="-1">
        <div class="confirm-dialog-copy">
          <h3 id="confirmDialogTitle"></h3>
          <p id="confirmDialogDescription"></p>
        </div>
        <div class="confirm-dialog-footer">
          <label class="confirm-dialog-dont-ask" id="confirmDialogDontAsk" hidden>
            <input type="checkbox" id="confirmDialogDontAskCheckbox" />
            <span data-i18n="dontAskAgain">不再提醒</span>
          </label>
          <div class="confirm-dialog-actions"><button class="btn-secondary" id="confirmDialogCancel" type="button" data-i18n="cancel">取消</button><button class="btn-danger" id="confirmDialogConfirm" type="button"></button></div>
        </div>
      </div>
    </div>

    <div class="image-preview-modal" id="imagePreviewModal" role="dialog" aria-modal="true" aria-labelledby="imagePreviewTitle" hidden>
      <div class="image-preview-card" tabindex="-1">
        <div class="image-preview-header"><p class="eyebrow" data-i18n="viewFullImage">查看大图</p><button class="icon-button" id="closeImagePreview" type="button" data-i18n-aria-label="closePreview" aria-label="关闭大图预览"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <div class="image-preview-stage" id="imagePreviewStage" role="region" data-i18n-aria-label="imagePreviewStage" aria-label="图片预览区域" aria-labelledby="imagePreviewTitle" tabindex="0"><img id="imagePreviewImage" alt="" /><video id="imagePreviewVideo" controls playsinline hidden></video></div>
        <h3 id="imagePreviewTitle"></h3>
      </div>
    </div>

    <!-- The V2 navigation becomes an explicit drawer below the reference's
         desktop breakpoint.  It is intentionally a sibling of the app shell:
         the scrim can cover the library without clipping at the rounded shell. -->
    <button class="mobile-nav-toggle" id="mobileNavToggle" type="button" data-i18n-aria-label="openNavigation" aria-label="打开导航" aria-controls="appSidebar" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="mobile-nav-scrim" id="mobileNavScrim" type="button" data-i18n-aria-label="closeNavigation" aria-label="关闭导航" hidden></button>

    <div class="shell" id="appShell">
      <aside class="sidebar" id="appSidebar" aria-label="GravityPort">
        <button class="mobile-nav-close" id="mobileNavClose" type="button" data-i18n-aria-label="closeNavigation" aria-label="关闭导航">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <div class="brand">
          <div class="brand-info">
            <h1>GravityPort</h1>
            <p class="sidebar-library-title" data-i18n="brandSubtitle">创作资产库</p>
          </div>
        </div>

        <nav class="primary-nav" data-i18n-aria-label="library" aria-label="素材库">
          <ul class="nav-list" id="quickFilters">
            <li><button class="nav-item active" data-filter="all" type="button" aria-pressed="true" data-i18n-title="allAssets" title="全部素材"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span class="nav-item-text" data-i18n="allAssets">全部素材</span><span class="nav-count">—</span></button></li>
            <li><button class="nav-item" data-filter="unorganized" type="button" aria-pressed="false" data-i18n-title="unorganized" title="待整理"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16l-2 14H6L4 5Z"/><path d="M7 12h3l2 2 2-2h3"/></svg><span class="nav-item-text" data-i18n="unorganized">待整理</span><span class="nav-count">—</span></button></li>
            <li><button class="nav-item" data-filter="favorite" type="button" aria-pressed="false" data-i18n-title="favorites" title="收藏"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg><span class="nav-item-text" data-i18n="favorites">收藏</span><span class="nav-count">—</span></button></li>
            <li><button class="nav-item" data-filter="trash" type="button" aria-pressed="false" data-i18n-title="trash" title="回收站"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span class="nav-item-text" data-i18n="trash">回收站</span><span class="nav-count">—</span></button></li>
          </ul>
          <div class="sidebar-group-heading">
            <button class="sidebar-section-toggle" id="smartGroupsToggle" type="button" aria-expanded="true" aria-controls="sidebarGroupList">
              <span class="nav-label" data-i18n="smartGroups">智能分组</span>
              <svg class="sidebar-section-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
            </button>
          </div>
          <ul class="sidebar-group-list" id="sidebarGroupList" data-i18n-aria-label="smartGroups" aria-label="智能分组"></ul>
          <div class="sidebar-group-heading sidebar-manual-group-heading">
            <button class="sidebar-section-toggle" id="assetCategoriesToggle" type="button" aria-expanded="true" aria-controls="sidebarManualGroupList">
              <span class="nav-label" data-i18n="assetCategories">分组</span>
              <svg class="sidebar-section-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
            </button>
            <button class="add-group-button" id="addGroupBtn" type="button" data-i18n-aria-label="addGroup" data-i18n-title="addGroup" aria-label="添加分组" title="添加分组">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <ul class="sidebar-group-list sidebar-manual-group-list" id="sidebarManualGroupList" data-i18n-aria-label="assetCategories" aria-label="分组"></ul>
        </nav>

        <div class="sidebar-spacer"></div>
        <div class="sidebar-footer">
          <div class="settings-wrap">
            <button class="settings-trigger" id="settingsToggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsMenu" data-i18n-aria-label="userCenterOpenSettings" data-i18n-title="userCenter" aria-label="用户中心，打开设置" title="用户中心"><span class="user-center-avatar" id="userCenterAvatar" aria-hidden="true">G</span><span class="settings-trigger-label" data-i18n="userCenter">用户中心</span></button>
          </div>
        </div>
      </aside>

      <main class="library">
        <!-- Phase 3A / D4 / F-01：主区内两个互斥 UI 状态——library-view（画廊模式）与
             asset-view（专用大图查看模式）。app.js setViewMode 以 hidden + inert + aria-hidden
             组合切换：退出布局、Tab 顺序与辅助技术树；既有内容保持原缩进以最小化 diff。 -->
        <section class="library-view" id="libraryView">
        <!-- GravityPort A3 顶栏三段（任务 70，按稿子精简）：左=.topbar-context 内
             .topbar-nav-group（后退/前进 + 堆叠返回），中=.topbar-size-group 缩略图大小
             滑杆（绝对居中，与左右重叠时由 JS 隐藏），右=.topbar-actions（分类、排序、
             搜索框；utility 组只保留不可见的桥接状态语义，primary 组是清空回收站 /
             打开检视器）。类型筛选（全部/图片/视频）从顶栏移除：mediaKind 状态与
             后端语义保留，renderTypeFilters 容忍容器不存在。范围标题 #viewTitle 连同
             .title-row 一起视觉隐藏（读屏仍能读到当前范围）。#statusText 独立于被隐藏的
             utility 组，持续保留 aria-live 播报。 -->
        <header class="topbar">
          <div class="topbar-context"><div class="topbar-nav-group"><button class="toolbar-icon nav-history-button" id="navHistoryBack" type="button" disabled data-i18n-aria-label="navHistoryBack" aria-label="后退"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button class="toolbar-icon nav-history-button" id="navHistoryForward" type="button" disabled data-i18n-aria-label="navHistoryForward" aria-label="前进"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div><div class="title-row visually-hidden"><h2 id="viewTitle">全部素材</h2></div></div>
          <div class="topbar-size-group" id="topbarSizeGroup" hidden><button class="toolbar-icon" id="gallerySizeMinus" type="button" data-i18n-aria-label="thumbSizeDecrease" aria-label="缩小缩略图"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg></button><input class="topbar-size-slider" id="gallerySizeSlider" type="range" min="120" max="400" step="20" value="200" data-i18n-aria-label="thumbSize" aria-label="缩略图大小" /><button class="toolbar-icon" id="gallerySizePlus" type="button" data-i18n-aria-label="thumbSizeIncrease" aria-label="放大缩略图"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
          <div class="topbar-actions">
            <span class="visually-hidden" id="statusText" role="status" aria-live="polite" aria-relevant="text" aria-atomic="true"></span>
            <div class="topbar-utility-group">
              <div class="bridge-status visually-hidden" id="bridgeStatus" data-state="checking" role="status" aria-live="polite"><span class="bridge-dot" aria-hidden="true"></span><span id="bridgeStatusLabel" data-i18n="statusChecking">检查桥接状态…</span><span class="bridge-status-meta visually-hidden" id="bridgeStatusMeta"></span></div>
            </div>
            <div class="topbar-work-group">
              <label class="sort-control category-control"><span class="visually-hidden" data-i18n="categoryFilterLabel">分类</span><select id="categorySelect" data-i18n-aria-label="categoryFilterLabel" aria-label="分类"><option value="" data-i18n="categoryAll">全部分类</option><option value="product" data-i18n="categoryProduct">产品</option><option value="concept" data-i18n="categoryConcept">概念</option><option value="texture" data-i18n="categoryTexture">纹理</option><option value="reference" data-i18n="categoryReference">参考</option><option value="other" data-i18n="categoryOther">其他</option></select></label>
              <label class="sort-control"><span class="visually-hidden" data-i18n="sortLabel">排序</span><select id="sortSelect" data-i18n-aria-label="sortLabel" aria-label="排序"><option value="newest" data-i18n="sortNewest">最新优先</option><option value="oldest" data-i18n="sortOldest">最旧优先</option><option value="name" data-i18n="sortName">按名称</option></select></label>
              <div class="topbar-search"><svg class="topbar-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="搜索所有素材..." data-i18n-aria-label="searchPlaceholder" aria-label="搜索素材" /></div>
            </div>
            <div class="topbar-primary-group">
              <button class="toolbar-filter trash-empty-button" id="emptyTrashBtn" type="button" hidden data-i18n="emptyTrash">清空回收站</button>
              <button class="toolbar-icon inspector-open-button" id="openInspectorBtn" type="button" hidden data-i18n-aria-label="openAssetInspector" aria-label="打开资产监视器"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M15 4v16"/><path d="m11 9-3 3 3 3"/></svg></button>
            </div>
          </div>
        </header>
        <section class="grid" id="assetGrid" data-i18n-aria-label="assetList" aria-label="素材列表" aria-busy="true" tabindex="-1"></section>
        </section>
        <!-- 专用大图查看模式骨架（GravityPort A4c，任务 90）：头部浮在舞台之上（不占布局、
             不拦舞台指针，子按钮恢复接收）——左上「< 返回」，右上「删除 / 适合窗口 / 全屏」；
             舞台占满整个主区，媒体按比例适合、竖直居中，左右两侧大箭头浮在舞台上。
             位置计数、上一张/下一张按钮组、缩放控制条、返回键里的范围名按稿子从界面拿掉
             （JS 引用、i18n 键与禁用语义保留，元素缺省时走既有空值守卫）。 -->
        <section class="asset-view" id="assetView" aria-labelledby="assetViewTitle" hidden inert aria-hidden="true">
          <header class="asset-view-header">
            <button class="toolbar-filter asset-view-back" id="assetViewBack" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span class="asset-view-back-label" data-i18n="assetViewBack">返回</span></button>
            <h2 class="visually-hidden" id="assetViewTitle"></h2>
            <div class="asset-view-actions" role="group" data-i18n-aria-label="assetViewActions" aria-label="大图操作">
              <button class="asset-view-action" id="assetViewDelete" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14Z"/></svg><span data-i18n="delete">删除</span></button>
              <button class="asset-view-action" id="assetZoomFit" type="button" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg><span data-i18n="zoomFit">适合窗口</span></button>
              <button class="asset-view-action" id="assetViewFullscreen" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/></svg><span data-i18n="fullscreen">全屏</span></button>
            </div>
          </header>
          <div class="asset-view-stage" id="assetViewStage">
            <img class="asset-view-image" id="assetViewImage" alt="" draggable="false" hidden />
            <video class="asset-view-video" id="assetViewVideo" controls playsinline hidden></video>
            <p class="asset-view-error" id="assetViewError" role="status" hidden></p>
            <!-- 左右翻页箭头（GravityPort A4c）：沿用 assetViewPrev/Next 的既有绑定、
                 焦点兜底与禁用语义（到头禁用，样式走现有 disabled token）；
                 键盘左右方向键照旧，箭头本身只补指针入口。 -->
            <button class="asset-view-arrow asset-view-arrow-prev" id="assetViewPrev" type="button" data-i18n-aria-label="assetNavPrev" aria-label="上一张素材" disabled>
              <svg width="18" height="36" viewBox="0 0 18 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 2 2 18l14 16"/></svg>
            </button>
            <button class="asset-view-arrow asset-view-arrow-next" id="assetViewNext" type="button" data-i18n-aria-label="assetNavNext" aria-label="下一张素材" disabled>
              <svg width="18" height="36" viewBox="0 0 18 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 2 14 16L2 34"/></svg>
            </button>
          </div>
        </section>
      </main>

      <!-- 素材详情（检视器）独立于画廊滚动容器。 -->
      <aside class="detail" id="detailPanel" data-i18n-aria-label="assetInspector" aria-label="素材详情" aria-hidden="true"></aside>
    </div>
    <div class="settings-menu" id="settingsMenu" data-i18n-aria-label="settings" aria-label="设置" hidden></div>

    <script type="module" src="/app.mjs"></script>
  </body>
</html>
